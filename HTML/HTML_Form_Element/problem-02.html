<!DOCTYPE html>
<html>
<head><title>Appointment Booking</title></head>
<body>

<h1>Clinic Appointment Booking</h1>
<p>Fill the form to book an appointment.</p>

<table border="1">
<tr><th>Day</th><th>Time</th></tr>
<tr><td>Mon-Fri</td><td>9 AM-6 PM</td></tr>
<tr><td>Saturday</td><td>9 AM-2 PM</td></tr>
</table>

<form>
<label>Name: <input type="text" name="name" required></label><br>
<label>Email: <input type="email" name="email" required></label><br>
<label>Mobile: <input type="tel" name="mobile" pattern="[0-9]{10}" required></label><br>
<label>DOB: <input type="date" name="dob" required></label><br>
<label>Date: <input type="date" name="date" required></label><br>
<label>Time: <input type="time" name="time" required></label><br>
<label>Doctor: <select name="doctor" required><option>Dr. A - Heart</option><option>Dr. B - Dentist</option><option>Dr. C - Brain</option><option>Dr. D - Skin</option><option>Dr. E - Child</option></select></label><br>
<label>Visit: <select name="visit"><option>New Patient</option><option>Follow-up</option><option>Consultation</option><option>Emergency</option></select></label><br>
<label>Contact: <select name="contact"><option>Phone</option><option>Email</option><option>SMS</option></select></label><br>
<label>Patient ID: <input type="text" name="id"></label><br>
<label>Reason: <textarea name="reason"></textarea></label><br>
<input type="checkbox" name="terms" required> I accept terms<br>
<input type="submit" value="Submit"> <input type="reset" value="Reset">
</form>

<p><a href="tel:112">Emergency: 112</a></p>
</body>
</html>


This is simple, short, and beginner-friendly while covering the assignment requirements.
